<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#e8e6df}canvas{display:block}</style><script type="module">
import * as T from 'three';
import {createAvatar} from '/src/player/avatar.ts';
const scene=new T.Scene();scene.background=new T.Color('#e8e6df');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.03,30);camera.position.set(0,1.1,-3.8);camera.lookAt(0,1.02,0);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xf2f1e9,0xaaa699,2));const sun=new T.DirectionalLight(0xfff2df,3);sun.position.set(-2.5,4,-3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=4;sun.shadow.camera.bottom=-2;sun.shadow.normalBias=.02;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xdedbd2,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const male=await createAvatar('male'),female=await createAvatar('female');male.root.position.x=-.5;female.root.position.x=.5;scene.add(male.root,female.root);male.update(.016,0,false);female.update(.016,0,false);window.preview={male,female,camera,scene};renderer.setAnimationLoop(()=>renderer.render(scene,camera));window.ready=true;
</script></html>
