<!doctype html><html><body style="margin:0"><script type="module">
import * as T from 'three';

import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x929f95);
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);camera.position.set(2,1.4,3);camera.lookAt(0,1,0);

renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
